{% extends "base.html" %}
{% block content %}
<div class="estado-container">
  <h2>Enviar Cotización</h2>
  <p>La cotización está lista. Puedes enviarla al cliente para su revisión.</p>

  <form method="post" action="{% url 'enviar_cotizacion' solicitud.id %}">

    {% csrf_token %}
    <button type="submit" class="btn btn-primary">Enviar cotización al cliente</button>
  </form>

  <a href="{% url 'retroceder_estado' solicitud.id %}" class="btn btn-secondary">Volver atrás</a>
</div>
{% endblock %}
