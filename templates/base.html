{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>CBC E.I.R.L.</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Tu CSS -->
  <link rel="stylesheet" href="{% static 'css/estilos.css' %}">
</head>

<body>

<!-- ================= NAVBAR ================= -->
<nav class="navbar navbar-expand-lg navbar-dark shadow" style="background-color:#151539 !important; min-height:70px;">
  <div class="container-fluid px-4">

    <!-- LOGO -->
    <a class="navbar-brand fw-bold" href="{% url 'inicio' %}">
      CBC E.I.R.L
    </a>

    <!-- BOTÓN MOBILE -->
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- MENÚ -->
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">

        <li class="nav-item">
          <a class="nav-link" href="{% url 'inicio' %}">Inicio</a>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="{% url 'servicios' %}">Servicios</a>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="{% url 'contacto' %}">Contacto</a>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="/admin/">Admin</a>
        </li>

      </ul>
    </div>

  </div>
</nav>

<!-- ================= CONTENIDO ================= -->
<main class="container mt-4">
  {% block content %}{% endblock %}
</main>

<!-- ================= FOOTER (opcional pro) ================= -->
<footer class="text-center mt-5 mb-3 text-muted">
  <small>© 2026 CBC E.I.R.L - Todos los derechos reservados</small>
</footer>

<!-- ================= SCRIPTS ================= -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

{% block scripts %}{% endblock %}

</body>
</html>
